name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a new Eleventy canary that breaks the plugin surfaces on its own
  # rather than waiting for someone to open a pull request.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is the floor declared in engines (matching eleventy 3's own >=18),
        # 22 and 24 are the LTS lines, 26 is Current.
        node: ['18', '22', '24', '26']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # The plugin itself has no dependencies, so there is nothing to install.
      - run: npm test

  examples:
    name: Example sites build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # `npm ci` installs exactly what the lockfiles pin, so the two-week minimum
      # age those lockfiles were resolved with still holds. Do not use `npm install`
      # here: it would re-resolve and could pull a package published hours ago.
      - name: Build the basic example
        working-directory: examples/basic
        run: |
          npm ci
          npm run build
          test -f _site/llms.txt

      - name: Build the advanced example
        working-directory: examples/advanced
        run: |
          npm ci
          npm run build
          test -f _site/ai/llms.txt

  eleventy-canary:
    # Informational: Eleventy 4 is still an alpha, so a failure here is news,
    # not a broken build. It must never block a pull request.
    name: Eleventy 4 canary (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Eleventy 4 requires >=22.15, so the engines floor of 18 cannot be used here.
          node-version: '24'

      - name: Build the advanced example against the Eleventy canary
        working-directory: examples/advanced
        # Deliberate exception to the lockfile rule used elsewhere: the point of
        # this job is to track the newest alpha, so it must re-resolve. Nothing
        # installed here is ever published.
        run: |
          npm ci
          npm install --no-save @11ty/eleventy@canary
          npx @11ty/eleventy --version
          npm run build
          test -f _site/ai/llms.txt
